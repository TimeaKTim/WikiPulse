name: wikipulse

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: wp-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics come only from kafka-init
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: wp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic $${KAFKA_TOPIC_RAW} --partitions $${KAFKA_TOPIC_PARTITIONS} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # Live listener: docker compose --profile live up -d
  # Backfill:      docker compose run --rm --no-deps collector -since 7d
  collector:
    build: .
    image: wikipulse-tools
    container_name: wp-collector
    profiles: [live]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    entrypoint: ["/collector"]
    ports:
      - "9101:9101" # Prometheus metrics
    volumes:
      - ./data:/app/data
      - ./.state:/app/.state
    restart: unless-stopped
    stop_grace_period: 30s # time to flush the archive and Kafka

  # Replay the archive: docker compose run --rm replay [-speed 60] [-from 7d] [-loop]
  replay:
    build: .
    image: wikipulse-tools
    container_name: wp-replay
    profiles: [replay]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/replay", "-broker", "kafka:9092", "-topic", "${KAFKA_TOPIC_RAW:-wiki.recentchange}"]
    command: ["-speed", "60"]
    volumes:
      - ./data:/app/data:ro
    stop_grace_period: 30s

volumes:
  kafka-data: